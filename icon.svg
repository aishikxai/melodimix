<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="grad1" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#2c2250;stop-opacity:1" />
      <stop offset="45%" style="stop-color:#140e28;stop-opacity:1" />
      <stop offset="90%" style="stop-color:#0b0813;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#050308;stop-opacity:1" />
    </radialGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1db954;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ffff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Backing card -->
  <rect width="512" height="512" rx="128" fill="url(#grad1)" />
  
  <!-- Outer Vinyl Rim -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#222" stroke-width="12" opacity="0.8" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="#181818" stroke-width="8" opacity="0.6" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="#2a2a2a" stroke-width="4" opacity="0.4" />
  
  <!-- Inner Label -->
  <circle cx="256" cy="256" r="90" fill="url(#grad2)" filter="url(#glow)" />
  
  <!-- Center Spindle Hole -->
  <circle cx="256" cy="256" r="24" fill="#0b0813" stroke="#000" stroke-width="4" />
  
  <!-- Dynamic wave lines representing playback -->
  <path d="M 180 200 Q 256 160 332 200" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.9" />
  <path d="M 160 256 Q 256 210 352 256" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.75" />
  <path d="M 185 312 Q 256 270 327 312" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.6" />
</svg>
